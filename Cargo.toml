[package]
name = "fabric-iroh"
description = "Minimal iroh/QUIC fabric for cross-device rows: postcard frames over bi-streams, implementing fabric::Fabric"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Dinesh Bhattarai <dineshdb@dbhattarai.info.np>"]

[dependencies]
fabric = { git = "https://github.com/qretaio/fabric.git", branch = "main" }
iroh = { version = "1.2", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "io-util", "macros"] }
thiserror = "2"

[dev-dependencies]
fabric = { git = "https://github.com/qretaio/fabric.git", branch = "main", features = ["postcard"] }
serde = { version = "1", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
